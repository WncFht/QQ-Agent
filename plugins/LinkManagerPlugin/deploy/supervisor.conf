[program:linkmanager-api]
command=/path/to/conda/envs/linkmanager/bin/python -m uvicorn plugins.LinkManagerPlugin.api.main:app --host 0.0.0.0 --port 8000
directory=/path/to/bot
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/linkmanager/api-err.log
stdout_logfile=/var/log/linkmanager/api-out.log
user=www-data  # 替换为你的用户
environment=PYTHONPATH="/path/to/bot"

[program:linkmanager-bot]
command=/path/to/conda/envs/linkmanager/bin/python -m bot
directory=/path/to/bot
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/linkmanager/bot-err.log
stdout_logfile=/var/log/linkmanager/bot-out.log
user=www-data  # 替换为你的用户
environment=PYTHONPATH="/path/to/bot"

[group:linkmanager]
programs=linkmanager-api,linkmanager-bot 